<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغامرات المهارات الحياتية</title>
<link href="./css2" rel="stylesheet">
<style>
:root{color-scheme:light;--mint:#bfead9;--blue:#cfe8fb;--yellow:#ffe9a8;--pink:#fbd3df;--g:#2eaf6b;--b:#3b8fe0;--o:#f59a23;--r:#e04b4b;--ink:#25414f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Tajawal','Tahoma','Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--mint),var(--blue) 60%,var(--yellow));color:var(--ink);min-height:100vh;font-size:22px;line-height:1.6}
#app{max-width:900px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:28px;padding:20px;box-shadow:0 6px 0 rgba(0,0,0,.08);margin-bottom:14px}
h1{font-size:2.1rem;margin:.2em 0;color:#1f7a55;text-align:center}
h2{font-size:1.5rem;margin:.2em 0;text-align:center}
.c{text-align:center}
.big{font-size:6rem;line-height:1.1}
.btn{font-family:inherit;font-size:1.4rem;font-weight:800;color:#fff;border:0;border-radius:22px;padding:14px 26px;min-height:62px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);margin:6px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.g{background:var(--g)}.b{background:var(--b)}.o{background:var(--o)}.r{background:var(--r)}
input{font-family:inherit;font-size:1.5rem;padding:14px;border-radius:18px;border:3px solid var(--b);width:min(100%,360px);text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.pill{background:var(--yellow);border-radius:30px;padding:6px 18px;font-weight:800}
.bar{height:16px;background:#e6eef3;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:width .4s}
.stage{display:flex;align-items:center;gap:16px;border-radius:26px;padding:18px;margin:12px 0;border:4px solid transparent}
.stage .ic{font-size:3.5rem}
.stage.lock{opacity:.55;filter:grayscale(.7)}.stage.cur{border-color:var(--o)}.stage.done{border-color:var(--g)}
.scene{background:var(--blue);border-radius:24px;padding:14px;text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.opt{font-family:inherit;font-size:1.25rem;font-weight:700;background:#fff;color:var(--ink);border:5px solid #d7e3ea;border-radius:24px;padding:14px;cursor:pointer;min-height:150px}
.opt .e{font-size:3.6rem;display:block}
.opt.sel{border-color:var(--b);background:#eaf4ff}
.opt.ok{border-color:var(--g);background:#e6f8ee}
.opt.dim{opacity:.25;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.slot{min-height:110px;border:4px dashed #9bb7c6;border-radius:20px;padding:6px;text-align:center;background:#f6fbff;position:relative}
.slot .n{position:absolute;top:2px;right:8px;font-weight:800;color:var(--b)}
.slot.ok{border:4px solid var(--g);background:#e6f8ee}
.chip{display:inline-block;background:var(--yellow);border-radius:18px;padding:8px 10px;margin:4px;cursor:grab;font-size:1.05rem;font-weight:700;user-select:none;border:3px solid #f1c94a}
.chip .e{font-size:2.2rem;display:block}
.pool{min-height:90px;background:#fff7dc;border-radius:20px;padding:6px;text-align:center}
.drop{width:190px;min-height:200px;margin:8px auto;border:5px dashed var(--b);border-radius:26px;padding:10px;background:#f2f9ff;text-align:center}
.fb{border-radius:22px;padding:14px;margin-top:12px;text-align:center;font-weight:700}
.fb.ok{background:#dff6e8;border:4px solid var(--g)}.fb.no{background:#fff0d9;border:4px solid var(--o)}
.fb .t{font-size:1.7rem;font-weight:800}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:2px dotted #cfdde5}
.lv{display:inline-block;border-radius:20px;padding:2px 16px;color:#fff;font-weight:800}
.lv0{background:var(--r)}.lv1{background:var(--o)}.lv2{background:var(--g)}
.cert{border:10px double #e0a93a;background:linear-gradient(#fffdf3,#fff3d1);border-radius:24px;padding:24px;text-align:center}
.cert .nm{font-size:2.4rem;font-weight:800;color:#1f7a55}
.tabs{display:flex;flex-wrap:wrap;justify-content:center}
.conf{position:fixed;top:-60px;font-size:2rem;animation:fall 3s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.pop{animation:pop .5s}@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.small{font-size:.85rem;opacity:.8;text-align:center}
@media print{body{background:#fff}.noprint{display:none!important}.card{box-shadow:none}}
</style>
</head>

}
function load(){
 const q=Q[S.i];C={tries:0,dim:[],sel:null,fin:false,fb:null};
 if(q.ty==='mc'||q.ty==='drag'){C.ord=sh(q.o.map((_,k)=>k))}
